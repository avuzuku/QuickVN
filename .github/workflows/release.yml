name: Build QuickVN Studio (3 OS + 5 Runtimes)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev libopenal-dev libflac-dev libvorbis-dev
      - name: Build QuickJS and SFML 3
        run: |
          git clone --depth 1 https://github.com/bellard/quickjs.git /tmp/quickjs
          make -C /tmp/quickjs libquickjs.a -j$(nproc)
          mkdir -p /tmp/deps/include/quickjs /tmp/deps/lib
          cp /tmp/quickjs/quickjs.h /tmp/quickjs/quickjs-libc.h /tmp/deps/include/quickjs/
          cp /tmp/quickjs/libquickjs.a /tmp/deps/lib/
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git /tmp/sfml
          cmake -S /tmp/sfml -B /tmp/sfml_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/deps
          cmake --build /tmp/sfml_build -j$(nproc)
          cmake --install /tmp/sfml_build
      - name: Build QuickVN Linux
        run: |
          cmake -S . -B /tmp/qvn_linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/deps -DQUICKJS_ROOT=/tmp/deps
          cmake --build /tmp/qvn_linux -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: |
            /tmp/qvn_linux/QuickVN_Studio
            /tmp/qvn_linux/quickjs_vn

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-rust
            git
      - name: Build QuickJS and SFML 3
        run: |
          git clone --depth 1 https://github.com/bellard/quickjs.git /tmp/quickjs
          make -C /tmp/quickjs libquickjs.a -j$(nproc)
          mkdir -p /tmp/deps/include/quickjs /tmp/deps/lib
          cp /tmp/quickjs/quickjs.h /tmp/quickjs/quickjs-libc.h /tmp/deps/include/quickjs/
          cp /tmp/quickjs/libquickjs.a /tmp/deps/lib/
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git /tmp/sfml
          cmake -S /tmp/sfml -B /tmp/sfml_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/deps
          cmake --build /tmp/sfml_build -j$(nproc)
          cmake --install /tmp/sfml_build
      - name: Build QuickVN Windows
        run: |
          cmake -S . -B /tmp/qvn_win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/deps -DQUICKJS_ROOT=/tmp/deps
          cmake --build /tmp/qvn_win -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: |
            D:/a/_temp/msys64/tmp/qvn_win/QuickVN_Studio.exe
            D:/a/_temp/msys64/tmp/qvn_win/quickjs_vn.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tools
        run: brew install cmake ninja
      - name: Build QuickJS and SFML 3
        run: |
          git clone --depth 1 https://github.com/bellard/quickjs.git /tmp/quickjs
          make -C /tmp/quickjs libquickjs.a -j$(sysctl -n hw.ncpu)
          mkdir -p /tmp/deps/include/quickjs /tmp/deps/lib
          cp /tmp/quickjs/quickjs.h /tmp/quickjs/quickjs-libc.h /tmp/deps/include/quickjs/
          cp /tmp/quickjs/libquickjs.a /tmp/deps/lib/
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git /tmp/sfml
          cmake -S /tmp/sfml -B /tmp/sfml_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/deps
          cmake --build /tmp/sfml_build -j$(sysctl -n hw.ncpu)
          cmake --install /tmp/sfml_build
      - name: Build QuickVN macOS
        run: |
          cmake -S . -B /tmp/qvn_mac -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/deps -DQUICKJS_ROOT=/tmp/deps
          cmake --build /tmp/qvn_mac -j$(sysctl -n hw.ncpu)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: |
            /tmp/qvn_mac/QuickVN_Studio
            /tmp/qvn_mac/quickjs_vn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Build Android Runtime Stub
        env:
          NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          API=24
          CC_BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          AR_BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC_BIN}"
          git clone --depth 1 https://github.com/bellard/quickjs.git /tmp/quickjs
          make -C /tmp/quickjs CC="${CC_BIN}" AR="${AR_BIN}" libquickjs.a -j$(nproc)
          mkdir -p /tmp/deps_android/include/quickjs /tmp/deps_android/lib
          cp /tmp/quickjs/quickjs.h /tmp/quickjs/quickjs-libc.h /tmp/deps_android/include/quickjs/
          cp /tmp/quickjs/libquickjs.a /tmp/deps_android/lib/
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git /tmp/sfml
          cmake -S /tmp/sfml -B /tmp/sfml_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-${API} \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/deps_android
          cmake --build /tmp/sfml_android -j$(nproc)
          cmake --install /tmp/sfml_android
          cmake -S . -B /tmp/qvn_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-${API} \
            -DCMAKE_BUILD_TYPE=Release -DQVN_BUILD_STUDIO=OFF \
            -DCMAKE_PREFIX_PATH=/tmp/deps_android -DQUICKJS_ROOT=/tmp/deps_android
          cmake --build /tmp/qvn_android -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-android
          path: /tmp/qvn_android/libquickjs_vn.so

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install tools
        run: brew install cmake ninja
      - name: Build iOS Runtime Stub
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC_BIN="$(xcrun --sdk iphoneos --find clang)"
          AR_BIN="$(xcrun --sdk iphoneos --find ar)"
          git clone --depth 1 https://github.com/bellard/quickjs.git /tmp/quickjs
          make -C /tmp/quickjs CC="${CC_BIN} -arch arm64 -isysroot ${SDK_PATH} -miphoneos-version-min=14.0" AR="${AR_BIN}" libquickjs.a -j$(sysctl -n hw.ncpu)
          mkdir -p /tmp/deps_ios/include/quickjs /tmp/deps_ios/lib
          cp /tmp/quickjs/quickjs.h /tmp/quickjs/quickjs-libc.h /tmp/deps_ios/include/quickjs/
          cp /tmp/quickjs/libquickjs.a /tmp/deps_ios/lib/
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git /tmp/sfml
          cmake -S /tmp/sfml -B /tmp/sfml_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/deps_ios
          cmake --build /tmp/sfml_ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          cmake --install /tmp/sfml_ios --config Release
          cmake -S . -B /tmp/qvn_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DQVN_BUILD_STUDIO=OFF -DCMAKE_PREFIX_PATH=/tmp/deps_ios -DQUICKJS_ROOT=/tmp/deps_ios
          cmake --build /tmp/qvn_ios --config Release --target quickjs_vn -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-ios
          path: /tmp/qvn_ios/Release-iphoneos/quickjs_vn.app/quickjs_vn

  package:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble 3 OS Studio Bundles
        run: |
          for os in linux windows macos; do
            mkdir -p out/${os}/proj
            mkdir -p out/${os}/runtimes/linux
            mkdir -p out/${os}/runtimes/windows
            mkdir -p out/${os}/runtimes/macos
            mkdir -p out/${os}/runtimes/android
            mkdir -p out/${os}/runtimes/ios
          done
          cp artifacts/bin-linux/QuickVN_Studio out/linux/QuickVN_Studio
          chmod +x out/linux/QuickVN_Studio
          cp artifacts/bin-windows/QuickVN_Studio.exe out/windows/QuickVN_Studio.exe
          cp artifacts/bin-macos/QuickVN_Studio out/macos/QuickVN_Studio
          chmod +x out/macos/QuickVN_Studio

          for os in linux windows macos; do
            cp artifacts/bin-linux/quickjs_vn out/${os}/runtimes/linux/quickjs_vn
            chmod +x out/${os}/runtimes/linux/quickjs_vn
            cp artifacts/bin-windows/quickjs_vn.exe out/${os}/runtimes/windows/quickjs_vn.exe
            cp artifacts/bin-macos/quickjs_vn out/${os}/runtimes/macos/quickjs_vn
            chmod +x out/${os}/runtimes/macos/quickjs_vn
            cp artifacts/runtime-android/libquickjs_vn.so out/${os}/runtimes/android/libquickjs_vn.so
            cp artifacts/runtime-ios/quickjs_vn out/${os}/runtimes/ios/quickjs_vn
          done

          tar -czf QuickVN_Studio_Linux.tar.gz -C out linux
          zip -r QuickVN_Studio_Windows.zip out/windows
          tar -czf QuickVN_Studio_macOS.tar.gz -C out macos
      - uses: actions/upload-artifact@v4
        with:
          name: QuickVN-Studio-Bundles
          path: |
            QuickVN_Studio_Linux.tar.gz
            QuickVN_Studio_Windows.zip
            QuickVN_Studio_macOS.tar.gz

      - name: Generate Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum QuickVN_Studio_Linux.tar.gz QuickVN_Studio_Windows.zip QuickVN_Studio_macOS.tar.gz > SHA256SUMS.txt
        
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            QuickVN_Studio_Linux.tar.gz
            QuickVN_Studio_Windows.zip
            QuickVN_Studio_macOS.tar.gz
            SHA256SUMS.txt
